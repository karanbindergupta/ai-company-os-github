name: AI Company OS CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:

jobs:
  verify:
    name: Verify company integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      # No third-party dependencies: this repository is stdlib Python + markdown.
      # Adding a dependency install step the project does not need would be theatre.
      - name: Show environment
        run: python3 -VV && sqlite3 --version || true

      - name: Format / syntax check (compile every module)
        run: python3 -m compileall -q scripts/

      - name: Secret scan
        run: sh scripts/secret_scan.sh

      - name: Clean-install bootstrap from empty state (canonical path)
        run: |
          rm -f .ai-company/state/company.db .ai-company/state/run.json .ai-company/state/tasks.json
          test ! -f .ai-company/state/company.db
          python3 scripts/bootstrap.py
          python3 - <<'CHECK'
          import sqlite3, sys
          c = sqlite3.connect('.ai-company/state/company.db')
          a = c.execute("SELECT COUNT(*) FROM agents").fetchone()[0]
          d = c.execute("SELECT COUNT(*) FROM decision_rights").fetchone()[0]
          g = c.execute("SELECT COUNT(*) FROM agents WHERE cognitive_style IS NOT NULL AND cognitive_style<>''").fetchone()[0]
          b = c.execute("SELECT COUNT(*) FROM behavioral_contracts").fetchone()[0]
          r = c.execute("SELECT COUNT(*) FROM permission_rules").fetchone()[0]
          k = c.execute("SELECT COUNT(*) FROM benchmarks").fetchone()[0]
          t = c.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
          print(f"agents={a} domains={d} cognitive={g} contracts={b} rules={r} benchmarks={k} tables={t}")
          bad = []
          if a != 121: bad.append(f"agents {a} != 121")
          if d != 29:  bad.append(f"domains {d} != 29")
          if g != 121: bad.append(f"cognitive profiles {g} != 121")
          if b != 121: bad.append(f"behavioural contracts {b} != 121")
          if r != 22:  bad.append(f"permission rules {r} != 22")
          if k != 7:   bad.append(f"benchmark scenarios {k} != 7")
          if t != 81:  bad.append(f"tables {t} != 81")
          # Runtime evidence must be ZERO on a clean install. A non-zero count here
          # means fabricated history was committed to source.
          for tbl, lbl in (("executions","executions"),("drill_runs","drill runs"),
                           ("ci_runs","ci runs"),("agent_performance","performance rows")):
              n = c.execute(f"SELECT COUNT(*) FROM {tbl}").fetchone()[0]
              if n: bad.append(f"FABRICATED: {n} {lbl} present on a clean install")
          if bad: print("CLEAN INSTALL FAILED: " + "; ".join(bad)); sys.exit(1)
          CHECK
          python3 scripts/companydb.py verify
          python3 scripts/harness.py verify

      - name: Build company database from the role registry
        run: python3 scripts/companydb.py init --force

      - name: Company state integrity
        run: python3 scripts/companydb.py verify

      - name: SOP phase/gate validation
        run: python3 scripts/company.py validate

      - name: Organization audit
        run: python3 scripts/audit_org.py

      - name: Capability validation
        run: python3 scripts/capability_validation.py

      - name: Cognitive validation
        run: python3 scripts/cognitive_validation.py

      - name: Readiness audit
        run: python3 scripts/readiness_audit.py

      # behavior_tests 19-30 assert that CI evidence exists. On a fresh runner it
      # does not, so generate it by ACTUALLY RUNNING the gates first (ci_report
      # writes observed=1 only on real execution). Reconciled from PR #1 of the
      # public snapshot, which discovered this by running CI remotely.
      - name: Generate real CI evidence (runs every gate except behaviour)
        run: python3 scripts/ci_report.py --pre-behavior > /dev/null

      # A clean runner has no drills, coaching or provider probes, so 16 of the 35
      # checks are legitimately NOT YET PROVEN. --clean-install asserts the exact
      # expected shape: any other failure is a regression, and any of those 16
      # PASSING means runtime evidence was fabricated. Both are hard failures.
      - name: Behavioural test suite (clean-install baseline)
        run: python3 scripts/behavior_tests.py --clean-install

      - name: Harness migrations are idempotent (run twice)
        run: |
          python3 scripts/harness.py migrate
          python3 scripts/harness.py migrate | grep -q "nothing to apply"

      - name: Harness ledger integrity
        run: python3 scripts/harness.py verify

      - name: Task store single-authority coherence
        run: python3 scripts/harness.py tasks-check

      - name: Harness evaluation and self-red-team
        run: python3 scripts/harness_eval.py

      - name: Harness benchmark (15 scenarios)
        run: python3 scripts/harness_bench.py

      - name: Emit machine-readable results
        if: always()
        run: python3 scripts/ci_report.py > ci-results.json && cat ci-results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci-results.json
